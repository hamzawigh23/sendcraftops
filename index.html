'use strict';
function initializeSite(){
  const menu=document.querySelector('.menu-toggle'), nav=document.querySelector('.nav-links');
  const closeMenu=()=>{if(!menu||!nav)return;menu.setAttribute('aria-expanded','false');menu.setAttribute('aria-label','Open menu');nav.classList.remove('is-open');document.body.classList.remove('menu-open');};
  if(menu&&nav){
    menu.addEventListener('click',()=>{const open=menu.getAttribute('aria-expanded')!=='true';menu.setAttribute('aria-expanded',String(open));menu.setAttribute('aria-label',open?'Close menu':'Open menu');nav.classList.toggle('is-open',open);document.body.classList.toggle('menu-open',open);});
    nav.addEventListener('click',e=>{if(e.target.closest('a'))closeMenu();});
    document.onkeydown=e=>{if(e.key==='Escape'){const wasOpen=menu.getAttribute('aria-expanded')==='true';closeMenu();if(wasOpen)menu.focus();}};
    window.onresize=()=>{if(window.innerWidth>850)closeMenu();};
  }
  const tabs=[...document.querySelectorAll('.demo-tab')], panel=document.querySelector('#campaign-example');
  const demos={
    offer:{subject:'A little space for good ideas',title:'A little space<br>for good ideas.',tag:'THE EVERYDAY EDIT',desc:'Thoughtful essentials for your desk.<br>A fresh perspective on the everyday.',cta:'Explore the collection',className:'offer-concept'},
    newsletter:{subject:'Something worth opening',title:'A quieter inbox.<br>A brighter idea.',tag:'FIELD NOTES / ISSUE 01',desc:'A few thoughtful finds.<br>One useful idea to take into your week.',cta:'Read the journal',className:'newsletter-concept'},
    launch:{subject:'Meet your next everyday essential',title:'Good things.<br>Just arrived.',tag:'A NEW CHAPTER',desc:'A considered new collection.<br>Made for small moments that matter.',cta:'Meet the new collection',className:'launch-concept'}
  };
  const selectTab=(tab)=>{if(!panel)return;tabs.forEach(t=>{t.setAttribute('aria-selected',String(t===tab));t.tabIndex=t===tab?0:-1;});const d=demos[tab.dataset.demo];panel.className='demo-display '+d.className;panel.setAttribute('aria-labelledby',tab.id);panel.querySelector('[data-subject]').textContent=d.subject;panel.querySelector('[data-title]').innerHTML=d.title;panel.querySelector('[data-tag]').textContent=d.tag;panel.querySelector('[data-desc]').innerHTML=d.desc;panel.querySelector('[data-cta]').textContent=d.cta;};
  tabs.forEach((t,i)=>{t.addEventListener('click',()=>selectTab(t));t.addEventListener('keydown',e=>{let n;if(['ArrowRight','ArrowDown'].includes(e.key))n=(i+1)%tabs.length;else if(['ArrowLeft','ArrowUp'].includes(e.key))n=(i+tabs.length-1)%tabs.length;else if(e.key==='Home')n=0;else if(e.key==='End')n=tabs.length-1;if(n!==undefined){e.preventDefault();selectTab(tabs[n]);tabs[n].focus();}});});
  const form=document.querySelector('#enquiry-form'),feedback=document.querySelector('#form-feedback');
  if(form&&feedback){
    const buildDraft=()=>{if(!form.reportValidity())return null;const v=new FormData(form);return 'SENDCRAFT OPS — ENQUIRY DRAFT\n\nName: '+v.get('name')+'\nEmail: '+v.get('email')+'\nTopic: '+v.get('topic')+'\n\n'+v.get('message')+'\n\nThis is a locally prepared draft. It has not been sent.';};
    form.addEventListener('submit',async e=>{e.preventDefault();const text=buildDraft();if(!text)return;try{await navigator.clipboard.writeText(text);feedback.textContent='Your enquiry draft was copied. Nothing has been sent or stored.';}catch{feedback.textContent='Clipboard access is unavailable here. Use “Save draft” to keep a local copy.';}});
    form.querySelector('[data-save-draft]').addEventListener('click',()=>{const text=buildDraft();if(!text)return;const url=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='sendcraftops-enquiry.txt';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),500);feedback.textContent='Draft saved to your device. Nothing has been sent or stored by this site.';});
  }
}

ound\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m14 5 5 5M4 20l4-1 12-12a3 3 0 0 0-4-4L4 15v5Z\"/></svg></div><h3>Campaign planning</h3><p>A clear offer, a defined audience, and a message with a reason to be in the inbox.</p><a class=\"text-link\" href=\"services.html#planning\">Explore the service<svg class=\"icon \" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.65\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 12h14m-6-6 6 6-6 6\"/></svg></a></article><article class=\"service-card\"><span class=\"card-number\">02</span><div class=\"service-icon\"><svg class=\"icon \" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.65\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"3\" y=\"4\" width=\"18\" height=\"16\" rx=\"2\"/><path d=\"M3 9h18M9 9v11\"/></svg></div><h3>Email creative</h3><p>Thoughtful copy and responsive layouts that bring an offer to life without unnecessary noise.</p><a class=\"text-link\" href=\"services.html#creative\">Explore the service<svg class=\"icon \" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.65\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 12h14m-6-6 6 6-6 6\"/></svg></a></article><article class=\"service-card\"><span class=\"card-number\">03</span><div class=\"service-icon\"><svg class=\"icon \" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.65\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 7h5m4 0h7M4 17h9m4 0h3\"/><circle cx=\"11\" cy=\"7\" r=\"2\"/><circle cx=\"15\" cy=\"17\" r=\"2\"/></svg></div><h3>Sending operations</h3><p>A measured process for authentication, delivery checks, and recipient feedback.</p><a class=\"text-link\" href=\"services.html#operations\">Explore the service<svg class=\"icon \" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.65\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 12h14m-6-6 6 6-6 6\"/></svg></a></article></div></div></section>\n<section class=\"section section-soft\"><div class=\"wrap split\"><div class=\"editorial-art\"><div class=\"brief-card\"><span class=\"brief-title\">THE CAMPAIGN BRIEF</span><h3>A message with<br>a reason to<br>be opened.</h3><div class=\"brief-line\"><svg class=\"icon \" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.65\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m5 12 4 4L19 6\"/></svg>One clear purpose</div><div class=\"brief-line\"><svg class=\"icon \" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.65\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m5 12 4 4L19 6\"/></svg>An audience that expects it</div><div class=\"brief-line\"><svg class=\"icon \" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.65\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m5 12 4 4L19 6\"/></svg>A thoughtful next step</div></div><div class=\"brief-annotation\">Less noise. More relevance.</div></div><div><span class=\"eyebrow\"><i></i>The way we think</span><h2>Make the message<br>matter to the person<br>receiving it.</h2><p>An offer is only the beginning. We want to help businesses shape emails that are useful, recognizable, and respectful of the people reading them.</p><div class=\"principle-list\"><div><svg class=\"icon \" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.65\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m5 12 4 4L19 6\"/></svg>A clear message, without inflated promises</div><div><svg class=\"icon \" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.65\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m5 12 4 4L19 6\"/></svg>A consistent identity across every campaign</div><div><svg class=\"icon \" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.65\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m5 12 4 4L19 6\"/></svg>Recipient preferences built into the process</div></div><a class=\"text-link\" href=\"approach.html\">Our approach to email<svg class=\"icon \" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.65\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 12h14m-6-6 6 6-6 6\"/></svg></a></div></div></section>\n<section class=\"section\"><div class=\"wrap\"><div class=\"section-top\"><div><span class=\"eyebrow\"><i></i>A considered process</span><h2>Start small.<br>Build with intention.</h2></div><p>No rush to chase volume. We\u2019re shaping a process that gives every campaign a clear purpose and room to improve.</p></div><div class=\"steps\"><article class=\"step\"><span class=\"step-number\">01</span><h3>Start with a purpose</h3><p>Decide what the message offers and why someone would welcome it.</p></article><article class=\"step\"><span class=\"step-number\">02</span><h3>Craft the campaign</h3><p>Bring the copy, layout and audience together before sending.</p></article><article class=\"step\"><span class=\"step-number\">03</span><h3>Begin thoughtfully</h3><p>Start small, with expected messages and careful checks.</p></article><article class=\"step\"><span class=\"step-number\">04</span><h3>Listen, then improve</h3><p>Use delivery signals and recipient feedback to guide the next step.</p></article></div></div></section>\n<section class=\"section section-soft\" style=\"margin-bottom:85px\"><div class=\"wrap\"><div class=\"center-head\"><span class=\"eyebrow\"><i></i>A few useful answers</span><h2>Before we get started.</h2></div><div class=\"faq-list\"><details><summary>Is SendCraft Ops a self-service email platform?<svg class=\"icon \" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.65\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 5v14M5 12h14\"/></svg></summary><p>No. We\u2019re developing an independent email marketing service, not a subscription software platform. The focus is campaign planning, creative work and careful sending operations.</p></details><details><summary>Can I book a campaign now?<svg class=\"icon \" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.65\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 5v14M5 12h14\"/></svg></summary><p>Not yet. We\u2019re preparing the infrastructure and working process before taking on campaign work. No payment or campaign booking is available on this website.</p></details><details><summary>Are the campaign examples real client work?<svg class=\"icon \" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.65\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 5v14M5 12h14\"/></svg></summary><p>The examples are original design concepts for a fictional brand. They show the intended design direction, not client work, sending history or campaign results.</p></details><details><summary>Who would receive the marketing emails?<svg class=\"icon \" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.65\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 5v14M5 12h14\"/></svg></summary><p>Our planned service is for newsletters and promotional messages to people who have chosen to receive them. Recipient preferences and a working unsubscribe process are part of the intended setup.</p></details></div></div></section><section class=\"cta-section\"><div class=\"wrap\"><div class=\"cta\"><div><span class=\"eyebrow\"><i></i>A thoughtful beginning</span><h2>Better messages.<br>One considered step at a time.</h2><p>We\u2019re preparing for launch. Explore the project and the way we plan to work.</p></div><a class=\"button button-light \" href=\"contact.html\">Get in touch<svg class=\"icon \" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.65\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 12h14m-6-6 6 6-6 6\"/></svg></a></div></div></section></main><footer class=\"footer\"><div class=\"wrap\"><div class=\"footer-grid\"><div><a class=\"brand\" href=\"index.html\"><img src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA2NCA2NCI+PGRlZnM+PGxpbmVhckdyYWRpZW50IGlkPSJ3aW5nIiB4MT0iOCIgeTE9IjUwIiB4Mj0iNTgiIHkyPSI4IiBncmFkaWVudFVuaXRzPSJ1c2VyU3BhY2VPblVzZSI+PHN0b3Agc3RvcC1jb2xvcj0iIzZiMzllZiIvPjxzdG9wIG9mZnNldD0iLjUzIiBzdG9wLWNvbG9yPSIjNDI2NWZiIi8+PHN0b3Agb2Zmc2V0PSIxIiBzdG9wLWNvbG9yPSIjMzNkNGVkIi8+PC9saW5lYXJHcmFkaWVudD48L2RlZnM+PHBhdGggZD0iTTUgMjUuNSA1Ny43IDUuM2MxLjUtLjYgMi45LjggMi4zIDIuM0w0MS44IDU3Yy0uNyAxLjktMy4xIDIuNC00LjUgMUwyNC45IDQ1LjhsLTguMSA3LjEgMS4zLTE4TDUuMiAzMC4yYy0yLjItLjgtMi4zLTMuOC0uMi00LjdaIiBmaWxsPSJ1cmwoI3dpbmcpIi8+PHBhdGggZD0ibTE4LjEgMzQuOSAzNS4yLTI0LjYtMjguNCAzNS41LTEuMy0xMC4xIDI5LjctMjUuNC0zMi4zIDI4LjMtNC4yIDE0LjNaIiBmaWxsPSIjZmZmIiBmaWxsLW9wYWNpdHk9Ii45MyIvPjxwYXRoIGQ9Im0yNC45IDQ1LjgtOC4xIDcuMSA2LjgtMTcuMloiIGZpbGw9IiMzMzIwODMiIG9wYWNpdHk9Ii42Ii8+PC9zdmc+\" class=\"brand-logo\" alt=\"\"><span><strong>SendCraft Ops</strong><small>YOUR OFFERS. THOUGHT enu-toggle\" type=\"button\" aria-label=\"Open menu\" aria-expanded=\"false\" aria-controls=\"main-navigation\"><span></span><span></span></button></div></header><main id=\"main\"><section class=\"page-intro\"><div class=\"wrap\"><div class=\"crumb\"><a href=\"index.html\">Home</a><span>/</span><span>Our approach</span></div><span class=\"eyebrow\"><i></i>Our approach</span><h1>A healthy beginning.<br><span class=\"gradient\">A considered next step.</span></h1><p>We\u2019re preparing an email marketing service around clear expectations, careful campaign preparation and measured sending \u2014 not volume for its own sake.</p></div></section><section class=\"section\"><div class=\"wrap\"><div class=\"steps\"><article class=\"step\"><span class=\"step-number\">01</span><h3>Start with a purpose</h3><p>Decide what the message offers and why someone would welcome it.</p></article><article class=\"step\"><span class=\"step-number\">02</span><h3>Craft the campaign</h3><p>Bring the copy, layout and audience together before sending.</p></article><article class=\"step\"><span class=\"step-number\">03</span><h3>Begin thoughtfully</h3><p>Start small, with expected messages and careful checks.</p></article><article class=\"step\"><span class=\"step-number\">04</span><h3>Listen, then improve</h3><p>Use delivery signals and recipient feedback to guide the next step.</p></article></div></div></section><section class=\"section section-soft\"><div class=\"wrap split\"><div><span class=\"eyebrow\"><i></i>Before a campaign launches</span><h2>The details matter.</h2><p>These are the operating standards we are preparing to put in place before launch. They describe our intended process, not a claim that the infrastructure is already fully operational.</p><a class=\"text-link\" href=\"about.html\">Where the project stands<svg class=\"icon \" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.65\" stroke-linecap=\"round\" stroke-linejoin=\ ion><section><h2>Contact arrangements</h2><p>A monitored project contact address is still being prepared. It must be published before this website begins collecting personal information. The current draft tool does not send information to the project.</p></section></div></div></section></main><footer class=\"footer\"><div class=\"wrap\"><div class=\"footer-grid\"><div><a class=\"brand\" href=\"index.html\"><img src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA2NCA2NCI+PGRlZnM+PGxpbmVhckdyYWRpZW50IGlkPSJ3aW5nIiB4MT0iOCIgeTE9IjUwIiB4Mj0iNTgiIHkyPSI4IiBncmFkaWVudFVuaXRzPSJ1c2VyU3BhY2VPblVzZSI+PHN0b3Agc3RvcC1jb2xvcj0iIzZiMzllZiIvPjxzdG9wIG9mZnNldD0iLjUzIiBzdG9wLWNvbG9yPSIjNDI2NWZiIi8+PHN0b3Agb2Zmc2V0PSIxIiBzdG9wLWNvbG9yPSIjMzNkNGVkIi8+PC9saW5lYXJHcmFkaWVudD48L2RlZnM+PHBhdGggZD0iTTUgMjUuNSA1Ny43IDUuM2MxLjUtLjYgMi45LjggMi4zIDIuM0w0MS44IDU3Yy0uNyAxLjktMy4xIDIuNC00LjUgMUwyNC45IDQ1LjhsLTguMSA3LjEgMS4zLTE4TDUuMiAzMC4yYy0yLjItLjgtMi4zLTMuOC0uMi00LjdaIiBmaWxsPSJ1cmwoI3dpbmcpIi8+PHBhdGggZD0ibTE4LjEgMzQuOSAzNS4yLTI0LjYtMjguNCAzNS41LTEuMy0xMC4xIDI5LjctMjUuNC0zMi4zIDI4LjMtNC4yIDE0LjNaIiBmaWxsPSIjZmZmIiBmaWxsLW9wYWNpdHk9Ii45MyIvPjxwYXRoIGQ9Im0yNC45IDQ1LjgtOC4xIDcuMSA2LjgtMTcuMloiIGZpbGw9IiMzMzIwODMiIG9wYWNpdHk9Ii42Ii8+PC9zdmc+\" class=\"brand-logo\" alt=\"\"><span><strong>SendCraft Ops</strong><small>YOUR OFFERS. THOUGHTFULLY DELIVERED.</small></span></a><p class=\"footer-desc\">An independent email marketing project in Gibraltar. Building a considered approach to campaigns, one message at a time.</p></div><div><div class=\"footer-title\">Explore</div><div class=\"footer-nav\"><a href=\"services.html\">Planned services</a><a href=\"examples.html\">Campaign examples</a><a href=\"approach.html\">Our approach</a><a href=\"about.html\">About the project</a></div></div><div><div class=\"footer-title\">Information</div><div class=\"footer-nav\"><a href=\"contact.html\">Contact</a><a href=\"privacy.html\">Privacy notice</a><a href=\"ter
